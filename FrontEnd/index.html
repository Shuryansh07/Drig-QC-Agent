<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b2f5c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="Grounded install and wiring support for field technicians."
    />
    <title>DRIG Tech Support</title>
    <style>
      /* Shown only until React mounts and replaces #root's contents — matches
         the app's own light/dark background tokens so there's no flash between
         this and the real screen underneath it. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: oklch(1 0 0);
        font-family: system-ui, sans-serif;
      }
      #boot-splash img {
        width: 64px;
        height: 64px;
        border-radius: 9999px;
        animation: boot-splash-pulse 1.4s ease-in-out infinite;
      }
      #boot-splash p {
        color: oklch(0.45 0 0);
        font-size: 0.9rem;
      }
      @keyframes boot-splash-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash {
          background: oklch(0.21 0 0);
        }
        #boot-splash p {
          color: oklch(0.76 0 0);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-live="polite">
        <img src="/favicon.png" alt="" />
        <p>Loading DRIG Support…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
